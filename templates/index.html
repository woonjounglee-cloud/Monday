<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }

        /* 탭 스타일 */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f8f9fa;
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            background: #f8f9fa;
            border: none;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover {
            background: #e9ecef;
            color: #333;
        }

        .tab.active {
            color: #667eea;
            background: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: #667eea;
        }

        .tab-content {
            display: none;
            padding: 40px;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 공통 스타일 */
        .section-title {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
        }

        .btn-export {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-export:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        /* 편집 가능한 셀 스타일 */
        td[contenteditable="true"]:hover {
            background: #f0f4ff;
            outline: 1px solid #667eea;
        }

        td[contenteditable="true"]:focus {
            background: #fff;
            outline: 2px solid #667eea;
        }

        /* 테이블 스타일 */
        .table-container {
            max-height: 500px;
            overflow: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #667eea;
            z-index: 10;
        }

        thead th {
            padding: 12px 8px;
            text-align: center;
            color: white;
            font-weight: 600;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }

        thead th:last-child {
            border-right: none;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

        tbody tr:nth-child(even):hover {
            background: #f0f0f0;
        }

        tbody td {
            padding: 10px 8px;
            border-right: 1px solid #eee;
            text-align: center;
        }

        tbody td:last-child {
            border-right: none;
        }

        /* Model Info 테이블 컬럼 너비 설정 - 비율 1.4:1.2:1:1:1 */
        #modelTableContainer table th:nth-child(1),
        #modelTableContainer table td:nth-child(1) {
            width: 168px;
            min-width: 168px;
            max-width: 168px;
        }

        #modelTableContainer table th:nth-child(2),
        #modelTableContainer table td:nth-child(2) {
            width: 144px;
            min-width: 144px;
            max-width: 144px;
        }

        #modelTableContainer table th:nth-child(3),
        #modelTableContainer table td:nth-child(3),
        #modelTableContainer table th:nth-child(4),
        #modelTableContainer table td:nth-child(4),
        #modelTableContainer table th:nth-child(5),
        #modelTableContainer table td:nth-child(5) {
            width: 120px;
            min-width: 120px;
            max-width: 120px;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Schedule 탭 전용 스타일 */
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-button {
            display: block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-align: center;
        }

        .file-input-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-name {
            display: block;
            margin-top: 8px;
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #2196F3;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .info-box ul {
            margin-left: 20px;
            color: #333;
            font-size: 13px;
        }

        .info-box li {
            margin-bottom: 4px;
        }

        /* Model Info 탭 전용 스타일 */
        .search-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .search-bar .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .add-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .export-section {
            text-align: right;
            margin-bottom: 20px;
        }

        .result-info {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Schedule 탭 2열 레이아웃 */
        .schedule-top-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .testhub-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .testhub-section h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .btn-testhub {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-testhub:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }

        /* Schedule 탭 - 달력 스타일 */
        .calendar-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0;
        }

        .current-month {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
            min-width: 200px;
            text-align: center;
        }

        .calendar-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        .week-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .week-table th {
            background: #667eea;
            color: white;
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .week-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            min-height: 40px;
            position: relative;
        }

        .week-table .category-cell {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            width: 150px;
            font-size: 14.4px;
        }

        .week-table .name-cell {
            background: #f0f4ff;
            font-weight: 500;
            width: 100px;
            font-size: 14.4px;
        }

        .week-table .day-cell {
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            width: 80px;
            min-width: 80px;
            max-width: 80px;
        }

        .week-table .day-cell.empty {
            cursor: default;
            background: #fafafa;
        }

        .week-table .day-cell:hover:not(.empty) {
            background: #f0f4ff;
        }

        .week-table .day-cell.selected {
            background: #667eea;
            color: white;
        }

        .week-table .day-cell.has-schedule {
            background: #e7f3ff;
            color: #333;
            font-weight: 500;
        }

        /* 주말 스타일 */
        .week-table .day-cell.saturday,
        .week-table .day-cell.sunday {
            cursor: default;
        }

        .week-table .day-cell.saturday {
            background: #e3f2fd;
        }

        .week-table .day-cell.sunday {
            background: #ffebee;
        }

        .schedule-entry {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: inline-block;
            margin: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .schedule-entry:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        /* 일정 추가 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Monday</h1>
            <p>Field Protocol 일정 관리 및 모델 데이터베이스</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('request')">📋 Request</button>
            <button class="tab" onclick="switchTab('schedule')">📅 Schedule</button>
            <button class="tab" onclick="switchTab('modelInfo')">🔍 Model Info.</button>
        </div>

        <!-- Request 탭 -->
        <div id="requestTab" class="tab-content active">
            <div class="schedule-top-section">
                <!-- 왼쪽: 검증허브 의뢰조회 -->
                <div class="testhub-section">
                    <h3>🔍 검증허브 의뢰조회</h3>
                    <button class="btn-testhub" onclick="openTestHub()">
                        검증허브 열기
                    </button>
                </div>

                <!-- 오른쪽: 일정 파일 업로드 -->
                <div class="upload-section">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="section-title">📊 일정 파일 업로드</div>

                        <div class="form-group">
                            <label class="form-label">Upload File</label>
                            <div class="file-input-wrapper">
                                <label for="schedule_file" class="file-input-button">파일 선택</label>
                                <input type="file" id="schedule_file" name="schedule_file" accept=".xlsx,.xls" required>
                                <span class="file-name" id="schedule_file_name">선택된 파일 없음</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                            📥 일정 처리 시작
                        </button>
                    </form>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #667eea;">처리 중...</p>
            </div>

            <div class="message" id="scheduleMessage"></div>

            <div class="result-section" id="scheduleResult" style="display: none; margin-top: 30px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div class="section-title" style="margin-bottom: 0;">📋 처리 결과</div>
                    <button class="btn btn-info" onclick="openOutputFolder()" style="font-size: 14px; padding: 8px 16px;">
                        📁 결과 파일
                    </button>
                </div>
                <div class="result-info" id="scheduleResultInfo"></div>
                <div class="table-container" id="scheduleTableContainer">
                    <table>
                        <thead id="scheduleTableHead"></thead>
                        <tbody id="scheduleTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Schedule 탭 -->
        <div id="scheduleTab" class="tab-content">
            <div class="calendar-controls">
                <button class="btn btn-primary" onclick="prevMonth()">◀ 이전 달</button>
                <span id="currentMonth" class="current-month">2025년 11월</span>
                <button class="btn btn-primary" onclick="nextMonth()">다음 달 ▶</button>
            </div>

            <div class="calendar-container" id="calendarContainer">
                <!-- Calendar will be dynamically generated here -->
            </div>

            <div class="message" id="calendarMessage"></div>
        </div>

        <!-- Model Info 탭 -->
        <div id="modelInfoTab" class="tab-content">
            <div class="search-section">
                <div class="section-title">🔍 모델 검색</div>
                <div class="search-bar">
                    <div class="form-group">
                        <label class="form-label">과제명 또는 개발모델명</label>
                        <input type="text" id="searchKeyword" placeholder="검색어를 입력하세요" onkeypress="if(event.key==='Enter') searchModel()">
                    </div>
                    <button class="btn btn-primary" onclick="searchModel()">검색</button>
                    <button class="btn btn-info" onclick="loadAllModels()">전체 보기</button>
                </div>
            </div>

            <div class="export-section">
                <button class="btn btn-export" onclick="exportModelDB()">
                    📊 Excel로 내보내기
                </button>
            </div>

            <div class="result-info" id="modelResultInfo"></div>

            <div class="table-container" id="modelTableContainer">
                <table>
                    <thead id="modelTableHead">
                        <tr>
                            <th>과제명</th>
                            <th>개발모델명</th>
                            <th>검증PL</th>
                            <th>모델담당자</th>
                            <th>AP/CP</th>
                            <th style="width: 80px;">작업</th>
                        </tr>
                    </thead>
                    <tbody id="modelTableBody">
                        <tr>
                            <td colspan="6" style="padding: 40px; color: #999;">
                                검색 버튼을 클릭하거나 전체 보기를 선택하세요
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="add-form">
                <div class="section-title">➕ 새 모델 정보 추가</div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">과제명 *</label>
                        <input type="text" id="addTaskName" placeholder="과제명">
                    </div>
                    <div class="form-group">
                        <label class="form-label">개발모델명 *</label>
                        <input type="text" id="addModelName" placeholder="개발모델명">
                    </div>
                    <div class="form-group">
                        <label class="form-label">검증PL *</label>
                        <input type="text" id="addPL" placeholder="검증PL">
                    </div>
                    <div class="form-group">
                        <label class="form-label">모델담당자 *</label>
                        <input type="text" id="addManager" placeholder="담당자">
                    </div>
                    <div class="form-group">
                        <label class="form-label">AP/CP *</label>
                        <input type="text" id="addAPCP" placeholder="AP 또는 CP">
                    </div>
                </div>
                <button class="btn btn-success" onclick="addModelInfo()">
                    ✅ 추가하기
                </button>
            </div>

            <div class="message" id="modelMessage"></div>
        </div>
    </div>

    <!-- Schedule Modal -->
    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">일정 추가/수정</div>
            <div class="form-group">
                <label class="form-label">일정 내용</label>
                <input type="text" id="scheduleText" placeholder="일정을 입력하세요">
            </div>
            <div class="form-group">
                <label class="form-label">선택된 기간</label>
                <input type="text" id="scheduleDateRange" readonly style="background: #f0f0f0;">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeScheduleModal()">취소</button>
                <button class="btn btn-danger" id="deleteScheduleBtn" onclick="deleteSchedule()" style="display: none;">삭제</button>
                <button class="btn btn-primary" onclick="saveSchedule()">저장</button>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let currentScheduleDownloadUrl = '';
        let currentSchedulePreviewUrl = '';
        let schedulePreviewData = null;

        // 검증허브 열기
        async function openTestHub() {
            console.log('검증허브 열기 버튼 클릭됨');
            try {
                console.log('API 요청 시작: /api/open-testhub');
                const response = await fetch('/api/open-testhub', {
                    method: 'POST'
                });

                console.log('API 응답 상태:', response.status);
                const result = await response.json();
                console.log('API 응답 결과:', result);

                if (result.success) {
                    showMessage('scheduleMessage', 'success', result.message + '\n\n파일 다운로드 및 처리 중입니다...');

                    // 결과 polling 시작 (3초 후부터 2초 간격으로 최대 20회)
                    let pollCount = 0;
                    const maxPolls = 20;

                    const pollInterval = setInterval(async () => {
                        pollCount++;
                        console.log(`결과 조회 시도 ${pollCount}/${maxPolls}`);

                        try {
                            const resultResponse = await fetch('/api/testhub-result');
                            const resultData = await resultResponse.json();

                            if (resultData.ready && resultData.success) {
                                clearInterval(pollInterval);
                                console.log('처리 결과 수신:', resultData);

                                // 결과 표시
                                displaySchedulePreview(resultData.data);
                                currentScheduleDownloadUrl = resultData.download_url;
                                showMessage('scheduleMessage', 'success',
                                    '검증허브 파일 처리 완료!\n결과 파일: ' + resultData.filename);
                            } else if (resultData.ready && !resultData.success) {
                                clearInterval(pollInterval);
                                showMessage('scheduleMessage', 'error',
                                    '파일 처리 실패: ' + (resultData.message || '알 수 없는 오류'));
                            } else if (pollCount >= maxPolls) {
                                clearInterval(pollInterval);
                                showMessage('scheduleMessage', 'warning',
                                    '처리 시간이 초과되었습니다. 수동으로 확인해주세요.');
                            }
                        } catch (pollError) {
                            console.error('결과 조회 실패:', pollError);
                        }
                    }, 2000);  // 2초마다 조회

                } else {
                    showMessage('scheduleMessage', 'error', result.message);
                }
            } catch (error) {
                console.error('검증허브 열기 에러:', error);
                showMessage('scheduleMessage', 'error', '검증허브 열기 실패: ' + error.message);
            }
        }

        // 탭 전환
        function switchTab(tabName) {
            // 모든 탭 비활성화
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // 선택된 탭 활성화
            if (tabName === 'request') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('requestTab').classList.add('active');
            } else if (tabName === 'schedule') {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('scheduleTab').classList.add('active');
                renderCalendar(); // Schedule 탭 열 때 달력 렌더링
            } else if (tabName === 'modelInfo') {
                document.querySelector('.tab:nth-child(3)').classList.add('active');
                document.getElementById('modelInfoTab').classList.add('active');
                loadAllModels(); // Model Info 탭 열 때 전체 데이터 로드
            }
        }

        // ========== Calendar (Schedule 탭) 기능 ==========

        // 달력 데이터 구조
        let currentYear = 2025;
        let currentMonth = 11; // November
        let scheduleData = {}; // { 'person|category|date': 'schedule text' }
        let dragStartCell = null;
        let dragEndCell = null;
        let isDragging = false;
        let modalOpenedFromMouseUp = false;

        // 카테고리와 담당자 정의
        const categories = [
            {
                name: '필드 프로토콜\n(고속주행)',
                people: ['정치영', '진정한', '오민석', '김은선']
            },
            {
                name: '5G Throughput',
                people: ['박성배']
            }
        ];

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            updateMonthDisplay();
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            updateMonthDisplay();
            renderCalendar();
        }

        function updateMonthDisplay() {
            document.getElementById('currentMonth').textContent = `${currentYear}년 ${currentMonth}월`;
        }

        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';

            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay(); // 0=일요일

            // 주차별로 나누기 (월~일)
            let weeks = [];
            let currentWeek = [];

            // 첫 번째 날의 요일 계산 (월요일 = 1, 일요일 = 0)
            let startDayOfWeek = firstDay === 0 ? 6 : firstDay - 1; // 월요일 기준으로 변환 (월=0, 일=6)

            // 첫 주의 빈 칸 추가 (월요일부터 시작)
            for (let i = 0; i < startDayOfWeek; i++) {
                currentWeek.push(null); // null은 빈 칸
            }

            // 모든 날짜 추가
            for (let day = 1; day <= daysInMonth; day++) {
                currentWeek.push(day);

                // 일요일이면 주차 완료 (currentWeek.length % 7 === 0)
                if (currentWeek.length === 7) {
                    weeks.push([...currentWeek]);
                    currentWeek = [];
                }
            }

            // 마지막 주의 빈 칸 채우기
            if (currentWeek.length > 0) {
                while (currentWeek.length < 7) {
                    currentWeek.push(null);
                }
                weeks.push([...currentWeek]);
            }

            // 각 주차별로 테이블 생성
            weeks.forEach((week, weekIndex) => {
                const table = createWeekTable(week, weekIndex);
                container.appendChild(table);
            });

            loadScheduleData();
        }

        function createWeekTable(days, weekIndex) {
            const table = document.createElement('table');
            table.className = 'week-table';

            // 헤더 생성
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');

            // 첫 번째 행: 요일 헤더
            headerRow.innerHTML = '<th>시험항목</th><th>담당자</th>';
            const dayNames = ['월', '화', '수', '목', '금', '토', '일'];
            days.forEach((day, index) => {
                const dayName = dayNames[index];
                if (day === null) {
                    // 빈 날짜는 요일만 표시
                    headerRow.innerHTML += `<th><br>(${dayName})</th>`;
                } else {
                    headerRow.innerHTML += `<th>${day}일<br>(${dayName})</th>`;
                }
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // 바디 생성
            const tbody = document.createElement('tbody');

            categories.forEach(category => {
                category.people.forEach((person, personIndex) => {
                    const row = document.createElement('tr');

                    // 카테고리 셀 (첫 번째 사람에게만)
                    if (personIndex === 0) {
                        const categoryCell = document.createElement('td');
                        categoryCell.className = 'category-cell';
                        categoryCell.textContent = category.name;
                        categoryCell.rowSpan = category.people.length;
                        row.appendChild(categoryCell);
                    }

                    // 담당자 셀
                    const nameCell = document.createElement('td');
                    nameCell.className = 'name-cell';
                    nameCell.textContent = person;
                    row.appendChild(nameCell);

                    // 날짜 셀들 (월~일 7개)
                    days.forEach((day, dayIndex) => {
                        const dayCell = document.createElement('td');
                        dayCell.className = 'day-cell';

                        if (day === null) {
                            // 빈 날짜 셀
                            dayCell.classList.add('empty');
                        } else {
                            // 실제 날짜 셀
                            dayCell.dataset.person = person;
                            dayCell.dataset.category = category.name;
                            dayCell.dataset.date = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                            // 주말 클래스 추가 (토요일=5, 일요일=6)
                            if (dayIndex === 5) {
                                dayCell.classList.add('saturday');
                            } else if (dayIndex === 6) {
                                dayCell.classList.add('sunday');
                            }

                            // 평일에만 이벤트 리스너 추가 (토일 제외)
                            if (dayIndex !== 5 && dayIndex !== 6) {
                                dayCell.addEventListener('mousedown', handleCellMouseDown);
                                dayCell.addEventListener('mouseover', handleCellMouseOver);
                                dayCell.addEventListener('mouseup', handleCellMouseUp);
                                dayCell.addEventListener('click', handleCellClick);
                            }
                        }

                        row.appendChild(dayCell);
                    });

                    tbody.appendChild(row);
                });
            });

            table.appendChild(tbody);
            return table;
        }

        function handleCellMouseDown(e) {
            if (e.button !== 0) return; // 왼쪽 클릭만
            isDragging = true;
            dragStartCell = e.target;
            dragEndCell = e.target;
            e.target.classList.add('selected');
            e.preventDefault();
        }

        function handleCellMouseOver(e) {
            if (!isDragging) return;

            const target = e.target;
            if (!target.classList.contains('day-cell')) return;

            // 같은 행(담당자)의 셀만 선택 가능
            if (target.dataset.person !== dragStartCell.dataset.person) return;

            dragEndCell = target;
            updateDragSelection();
        }

        function handleCellMouseUp(e) {
            if (!isDragging) return;
            isDragging = false;

            // 선택된 범위 확인
            const selectedCells = document.querySelectorAll('.day-cell.selected');
            if (selectedCells.length > 0) {
                openScheduleModal(selectedCells);
                modalOpenedFromMouseUp = true;
            }
        }

        function handleCellClick(e) {
            // mouseup에서 모달을 이미 열었으면 무시
            if (modalOpenedFromMouseUp) {
                modalOpenedFromMouseUp = false;
                return;
            }

            if (isDragging) return; // 드래그 중이면 무시

            const cell = e.target;
            // 일정 추가 모달 열기
            cell.classList.add('selected');
            openScheduleModal([cell]);
        }

        function updateDragSelection() {
            // 모든 선택 해제
            document.querySelectorAll('.day-cell.selected').forEach(cell => {
                cell.classList.remove('selected');
            });

            if (!dragStartCell || !dragEndCell) return;

            // 같은 행의 셀들 찾기
            const row = dragStartCell.parentElement;
            const cells = Array.from(row.querySelectorAll('.day-cell'));

            const startIndex = cells.indexOf(dragStartCell);
            const endIndex = cells.indexOf(dragEndCell);

            const minIndex = Math.min(startIndex, endIndex);
            const maxIndex = Math.max(startIndex, endIndex);

            for (let i = minIndex; i <= maxIndex; i++) {
                // 빈 칸과 주말은 선택하지 않음
                if (!cells[i].classList.contains('empty') &&
                    !cells[i].classList.contains('saturday') &&
                    !cells[i].classList.contains('sunday')) {
                    cells[i].classList.add('selected');
                }
            }
        }

        function getScheduleKey(cell) {
            return `${cell.dataset.person}|${cell.dataset.category}|${cell.dataset.date}`;
        }

        function openScheduleModal(cells) {
            const modal = document.getElementById('scheduleModal');
            const dateRange = document.getElementById('scheduleDateRange');
            const scheduleText = document.getElementById('scheduleText');
            const deleteBtn = document.getElementById('deleteScheduleBtn');

            if (cells.length === 1) {
                const cell = cells[0];
                const key = getScheduleKey(cell);

                dateRange.value = `${cell.dataset.person} - ${cell.dataset.date}`;
                scheduleText.value = scheduleData[key] || '';

                // 기존 일정이 있으면 삭제 버튼 표시
                deleteBtn.style.display = scheduleData[key] ? 'inline-block' : 'none';
            } else {
                const firstCell = cells[0];
                const lastCell = cells[cells.length - 1];
                dateRange.value = `${firstCell.dataset.person} - ${firstCell.dataset.date} ~ ${lastCell.dataset.date}`;
                scheduleText.value = '';
                deleteBtn.style.display = 'none';
            }

            modal.style.display = 'block';
            scheduleText.focus();
        }

        function closeScheduleModal() {
            const modal = document.getElementById('scheduleModal');
            modal.style.display = 'none';

            // 선택 해제
            document.querySelectorAll('.day-cell.selected').forEach(cell => {
                cell.classList.remove('selected');
            });

            dragStartCell = null;
            dragEndCell = null;
        }

        function saveSchedule() {
            const scheduleText = document.getElementById('scheduleText').value.trim();

            if (!scheduleText) {
                alert('일정 내용을 입력해주세요.');
                return;
            }

            const selectedCells = document.querySelectorAll('.day-cell.selected');

            selectedCells.forEach(cell => {
                const key = getScheduleKey(cell);
                scheduleData[key] = scheduleText;
            });

            saveScheduleData();
            closeScheduleModal();
            renderCalendar();
            showMessage('calendarMessage', 'success', '일정이 저장되었습니다.');
        }

        function editSchedule(cell) {
            cell.classList.add('selected');
            openScheduleModal([cell]);
        }

        function deleteSchedule() {
            if (!confirm('일정을 삭제하시겠습니까?')) {
                return;
            }

            const selectedCells = document.querySelectorAll('.day-cell.selected');

            selectedCells.forEach(cell => {
                const key = getScheduleKey(cell);
                delete scheduleData[key];
            });

            saveScheduleData();
            closeScheduleModal();
            renderCalendar();
            showMessage('calendarMessage', 'success', '일정이 삭제되었습니다.');
        }

        function saveScheduleData() {
            localStorage.setItem('mondayScheduleData', JSON.stringify(scheduleData));
        }

        function loadScheduleData() {
            const saved = localStorage.getItem('mondayScheduleData');
            if (saved) {
                scheduleData = JSON.parse(saved);
            }

            // 달력에 일정 표시
            Object.keys(scheduleData).forEach(key => {
                const [person, category, date] = key.split('|');
                const cell = document.querySelector(
                    `.day-cell[data-person="${person}"][data-category="${category}"][data-date="${date}"]`
                );

                if (cell) {
                    cell.classList.add('has-schedule');
                    const entry = document.createElement('div');
                    entry.className = 'schedule-entry';
                    entry.textContent = scheduleData[key];
                    entry.onclick = (e) => {
                        e.stopPropagation();
                        cell.classList.add('selected');
                        openScheduleModal([cell]);
                    };
                    cell.innerHTML = '';
                    cell.appendChild(entry);
                }
            });
        }

        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('scheduleModal');
            if (event.target === modal) {
                closeScheduleModal();
            }
        }

        // ========== Request 탭 기능 ==========

        // 파일 선택 시 파일명 표시
        const scheduleFileInput = document.getElementById('schedule_file');
        const scheduleFileNameSpan = document.getElementById('schedule_file_name');

        scheduleFileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                scheduleFileNameSpan.textContent = this.files[0].name;
                scheduleFileNameSpan.style.color = '#28a745';
            } else {
                scheduleFileNameSpan.textContent = '선택된 파일 없음';
                scheduleFileNameSpan.style.color = '#666';
            }
        });

        // 폼 제출
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const submitButton = this.querySelector('button[type="submit"]');
            const loading = document.getElementById('loading');
            const message = document.getElementById('scheduleMessage');
            const resultSection = document.getElementById('scheduleResult');

            // Schedule 파일 확인
            const scheduleFile = formData.get('schedule_file');
            if (!scheduleFile || scheduleFile.size === 0) {
                showMessage('scheduleMessage', 'error', 'Schedule 파일을 선택해주세요.');
                return;
            }

            submitButton.disabled = true;
            loading.style.display = 'block';
            message.style.display = 'none';
            resultSection.style.display = 'none';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    currentScheduleDownloadUrl = result.download_url;
                    currentSchedulePreviewUrl = result.preview_url;

                    showMessage('scheduleMessage', 'success', result.message);
                    resultSection.style.display = 'block';
                    loadSchedulePreview();
                } else {
                    showMessage('scheduleMessage', 'error', result.message);
                }
            } catch (error) {
                showMessage('scheduleMessage', 'error', '서버 오류: ' + error.message);
            } finally {
                submitButton.disabled = false;
                loading.style.display = 'none';
            }
        });

        async function loadSchedulePreview() {
            try {
                const response = await fetch(currentSchedulePreviewUrl);
                const result = await response.json();

                if (result.success) {
                    schedulePreviewData = result.data;
                    document.getElementById('scheduleResultInfo').textContent =
                        `총 ${result.data.total_rows}개 행`;
                    showSchedulePreview();
                }
            } catch (error) {
                console.error('미리보기 로드 실패:', error);
            }
        }

        function toggleSchedulePreview() {
            const container = document.getElementById('scheduleTableContainer');
            if (container.style.display === 'none') {
                showSchedulePreview();
            } else {
                container.style.display = 'none';
            }
        }

        function showSchedulePreview() {
            if (!schedulePreviewData) return;

            const container = document.getElementById('scheduleTableContainer');
            const tableHead = document.getElementById('scheduleTableHead');
            const tableBody = document.getElementById('scheduleTableBody');

            tableHead.innerHTML = '<tr>' +
                schedulePreviewData.columns.map(col => `<th>${col}</th>`).join('') +
                '</tr>';

            tableBody.innerHTML = schedulePreviewData.rows.map(row =>
                '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>'
            ).join('');

            container.style.display = 'block';
        }

        function displaySchedulePreview(data) {
            // 검증허브 결과 데이터를 표시하는 함수
            schedulePreviewData = data;
            const resultSection = document.getElementById('scheduleResult');
            const resultInfo = document.getElementById('scheduleResultInfo');

            resultInfo.textContent = `총 ${data.total_rows}개 행`;
            resultSection.style.display = 'block';
            showSchedulePreview();
        }

        function downloadScheduleFile() {
            if (currentScheduleDownloadUrl) {
                window.open(currentScheduleDownloadUrl, '_blank');
            }
        }

        async function openOutputFolder() {
            try {
                const response = await fetch('/api/open-output-folder', {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    // 폴더가 열렸음을 알림
                    showMessage('scheduleMessage', 'success', result.message);
                    console.log('폴더 열기 성공:', result.folder_path);
                    console.log('결과 파일:', result.filename);
                } else {
                    showMessage('scheduleMessage', 'error', result.message);
                }
            } catch (error) {
                console.error('폴더 열기 에러:', error);
                showMessage('scheduleMessage', 'error', '폴더 열기 실패: ' + error.message);
            }
        }

        // ========== Model Info 탭 기능 ==========

        async function loadAllModels() {
            try {
                const response = await fetch('/api/model-info/all');
                const result = await response.json();

                if (result.success) {
                    displayModelData(result.data);
                    document.getElementById('modelResultInfo').textContent =
                        `전체 ${result.data.total_rows}개의 모델 정보`;
                }
            } catch (error) {
                showMessage('modelMessage', 'error', '데이터 로드 실패: ' + error.message);
            }
        }

        async function searchModel() {
            const keyword = document.getElementById('searchKeyword').value.trim();

            if (!keyword) {
                showMessage('modelMessage', 'error', '검색어를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/model-info/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword: keyword })
                });

                const result = await response.json();

                if (result.success) {
                    displayModelData(result.data);
                    document.getElementById('modelResultInfo').textContent = result.message;
                    showMessage('modelMessage', 'success', result.message);
                } else {
                    showMessage('modelMessage', 'error', result.message);
                }
            } catch (error) {
                showMessage('modelMessage', 'error', '검색 실패: ' + error.message);
            }
        }

        function displayModelData(data) {
            const tableBody = document.getElementById('modelTableBody');
            const columns = data.columns; // ['과제명', '개발모델명', '검증PL', '모델담당자', 'AP/CP']

            if (data.total_rows === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="padding: 40px; color: #999;">검색 결과가 없습니다</td></tr>';
                return;
            }

            tableBody.innerHTML = data.rows.map((row, rowIndex) => {
                const cells = row.map((cell, colIndex) => {
                    const fieldName = columns[colIndex];
                    return `<td contenteditable="true"
                                data-row="${rowIndex}"
                                data-field="${fieldName}"
                                onblur="updateCell(this)"
                                style="cursor: text;">${cell}</td>`;
                }).join('');

                const deleteBtn = `<td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteRow(${rowIndex})" title="삭제">
                        🗑️
                    </button>
                </td>`;

                return '<tr>' + cells + deleteBtn + '</tr>';
            }).join('');
        }

        async function updateCell(cell) {
            const rowIndex = parseInt(cell.dataset.row);
            const fieldName = cell.dataset.field;
            const newValue = cell.textContent.trim();

            try {
                const response = await fetch('/api/model-info/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        row_index: rowIndex,
                        field: fieldName,
                        value: newValue
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('modelMessage', 'success', '수정되었습니다.');
                } else {
                    showMessage('modelMessage', 'error', result.message);
                    // 원래 값으로 복원 (실패 시)
                    loadAllModels();
                }
            } catch (error) {
                showMessage('modelMessage', 'error', '수정 실패: ' + error.message);
                loadAllModels();
            }
        }

        async function deleteRow(rowIndex) {
            if (!confirm('정말 삭제하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch('/api/model-info/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        row_index: rowIndex
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('modelMessage', 'success', result.message);
                    // 테이블 새로고침
                    loadAllModels();
                } else {
                    showMessage('modelMessage', 'error', result.message);
                }
            } catch (error) {
                showMessage('modelMessage', 'error', '삭제 실패: ' + error.message);
            }
        }

        async function addModelInfo() {
            const data = {
                '과제명': document.getElementById('addTaskName').value.trim(),
                '개발모델명': document.getElementById('addModelName').value.trim(),
                '검증PL': document.getElementById('addPL').value.trim(),
                '모델담당자': document.getElementById('addManager').value.trim(),
                'AP/CP': document.getElementById('addAPCP').value.trim()
            };

            // 유효성 검사
            for (const [key, value] of Object.entries(data)) {
                if (!value) {
                    showMessage('modelMessage', 'error', `${key}을(를) 입력해주세요.`);
                    return;
                }
            }

            try {
                const response = await fetch('/api/model-info/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('modelMessage', 'success', result.message);

                    // 폼 초기화
                    document.getElementById('addTaskName').value = '';
                    document.getElementById('addModelName').value = '';
                    document.getElementById('addPL').value = '';
                    document.getElementById('addManager').value = '';
                    document.getElementById('addAPCP').value = '';

                    // 전체 데이터 다시 로드
                    loadAllModels();
                } else {
                    showMessage('modelMessage', 'error', result.message);
                }
            } catch (error) {
                showMessage('modelMessage', 'error', '추가 실패: ' + error.message);
            }
        }

        async function exportModelDB() {
            try {
                window.open('/api/model-info/export', '_blank');
                showMessage('modelMessage', 'success', 'Excel 파일을 다운로드합니다.');
            } catch (error) {
                showMessage('modelMessage', 'error', 'Export 실패: ' + error.message);
            }
        }

        // 유틸리티 함수
        function showMessage(elementId, type, text) {
            const message = document.getElementById(elementId);
            message.className = 'message ' + type;
            message.textContent = text;
            message.style.display = 'block';

            // 3초 후 자동 숨김
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        // 페이지 로드 시 Model Info 초기 데이터 로드
        document.addEventListener('DOMContentLoaded', () => {
            // Schedule 탭이 기본으로 활성화되어 있으므로 Model Info는 로드하지 않음
        });
    </script>
</body>
</html>
